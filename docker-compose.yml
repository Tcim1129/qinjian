services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: always
    environment:
      POSTGRES_DB: qinjian
      POSTGRES_USER: qinjian
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    # 生产环境不暴露PG端口到外网
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 限制内存（2C/4GB服务器省着用）
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    restart: always
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    expose:
      - "6379"
    volumes:
      - redisdata:/data
    deploy:
      resources:
        limits:
          memory: 128M

  backend:
    build: ./backend
    restart: always
    expose:
      - "8000"
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: postgresql+psycopg://qinjian:${DB_PASSWORD:?DB_PASSWORD is required}@db:5432/qinjian
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-}
      ADDITIONAL_FRONTEND_ORIGINS: ${ADDITIONAL_FRONTEND_ORIGINS:-}
      RELAXED_TEST_ACCOUNT_EMAILS: ${RELAXED_TEST_ACCOUNT_EMAILS:-}
      ALLOW_DEMO_AGENT: ${ALLOW_DEMO_AGENT:-false}
      PHONE_CODE_STORE: ${PHONE_CODE_STORE:-redis}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://llm-ipplpz10dpd82u07.cn-beijing.maas.aliyuncs.com/compatible-mode/v1}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      SILICONFLOW_BASE_URL: https://api.siliconflow.cn/v1
      AI_MULTIMODAL_MODEL: ${AI_MULTIMODAL_MODEL:-qwen3.8-flash}
      AI_MULTIMODAL_FALLBACK_MODEL: ${AI_MULTIMODAL_FALLBACK_MODEL:-qwen3.8-flash}
      AI_TEXT_MODEL: ${AI_TEXT_MODEL:-deepseek-v4.1-flash}
      AI_TEXT_FALLBACK_MODEL: ${AI_TEXT_FALLBACK_MODEL:-deepseek-v4.1-flash}
      ASR_PROVIDER: ${ASR_PROVIDER:-qwen3}
      OPENAI_COMPATIBLE_ASR_MODEL: ${OPENAI_COMPATIBLE_ASR_MODEL:-whisper-1}
      REALTIME_ASR_PROVIDER: ${REALTIME_ASR_PROVIDER:-qwen3}
      REALTIME_ASR_TICKET_EXPIRE_SECONDS: ${REALTIME_ASR_TICKET_EXPIRE_SECONDS:-120}
      REALTIME_ASR_MAX_SESSION_SECONDS: ${REALTIME_ASR_MAX_SESSION_SECONDS:-60}
      REALTIME_ASR_STOP_TIMEOUT_SECONDS: ${REALTIME_ASR_STOP_TIMEOUT_SECONDS:-12}
      QWEN_ASR_API_KEY: ${QWEN_ASR_API_KEY:-}
      QWEN_ASR_BASE_URL: ${QWEN_ASR_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      QWEN_ASR_FILE_MODEL: ${QWEN_ASR_FILE_MODEL:-qwen3-asr-flash}
      QWEN_ASR_REALTIME_MODEL: ${QWEN_ASR_REALTIME_MODEL:-qwen3-asr-flash-realtime}
    volumes:
      - uploads:/app/uploads
    deploy:
      resources:
        limits:
          memory: 1G

  web:
    image: ${NGINX_IMAGE:-nginx:alpine}
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./web-vue3/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  pgdata:
  redisdata:
  uploads:
